<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>그리는 자의 바다 — Draw the Sea (Prototype)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 타이틀 화면 -->
    <section id="screen-title" class="screen active">
      <h1 class="game-title">그리는 자의 바다</h1>
      <p class="game-subtitle">Draw the Sea — 코어 루프 프로토타입 v0</p>
      <p class="game-desc">진심을 담아 그린 그림은 실체가 된다.<br/>그림을 그려 보스를 물리쳐라!</p>
      <button id="btn-start" class="btn-primary">출항하기</button>
    </section>

    <!-- 전투 화면 -->
    <section id="screen-battle" class="screen">
      <div class="battle-stage">
        <div class="boss-area">
          <div class="boss-hp-wrap">
            <span class="boss-name">황금 재규어 오로</span>
            <div class="hp-bar"><div id="boss-hp" class="hp-fill"></div></div>
          </div>
          <div id="boss-sprite" class="boss-sprite">🐆</div>
          <div id="damage-float" class="damage-float"></div>
        </div>
        <div id="battle-log" class="battle-log">피기: "저 재규어는 무기에 약해! 뭐든 무기를 그려봐!"</div>
      </div>

      <div class="draw-area">
        <div class="draw-header">
          <span id="draw-prompt">⚔️ 무기를 그려라!</span>
          <span id="draw-timer" class="draw-timer">20</span>
        </div>
        <canvas id="draw-canvas"></canvas>
        <div class="draw-tools">
          <button id="btn-clear" class="btn-tool">지우기</button>
          <button id="btn-submit" class="btn-primary">이걸로 공격!</button>
        </div>
      </div>
    </section>

    <!-- 승리 화면 -->
    <section id="screen-victory" class="screen">
      <h1>🏆 승리!</h1>
      <p class="game-desc">오로가 제정신을 찾았다!<br/>도안 조각 ①을 손에 넣었다.</p>
      <div class="blueprint-piece">📜 도안 조각 ① — 강화 선체</div>
      <button id="btn-restart" class="btn-primary">다시 도전</button>
    </section>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
