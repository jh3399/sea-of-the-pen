<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>그리는 자의 바다 — Sea of the Pen</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas" class="pixel"></canvas>
  <div id="app">
    <!-- 상단 HUD: 진행도(조각)·현재 위치·지도·가방·설정 (타이틀에선 숨김) -->
    <header id="hud" hidden>
      <div class="hud-left">
        <span id="hud-stage" class="hud-chip">출항 준비</span>
      </div>
      <div class="hud-right">
        <span id="hud-pieces" class="hud-chip gold" title="모은 도안 조각">📜 0/7</span>
        <button id="btn-map" class="hud-btn" title="지도">🗺️</button>
        <button id="btn-inv" class="hud-btn" title="가방">🎒</button>
        <button id="btn-hud-settings" class="hud-btn" title="설정">⚙️</button>
      </div>
    </header>

    <!-- 타이틀 화면 -->
    <section id="screen-title" class="screen active">
      <div class="title-wrap">
        <p class="game-subtitle">~ SEA OF THE PEN ~</p>
        <h1 class="game-title">그리는 자의<br/>바다</h1>
        <p class="game-desc">진심을 담아 그린 그림은 실체가 된다.</p>
      </div>
      <div class="title-menu">
        <button id="btn-continue" class="btn-primary" hidden>▶ 이어하기</button>
        <button id="btn-start" class="btn-primary btn-start">▶ 새 모험</button>
        <button id="btn-title-settings" class="btn-tool">⚙ 설정</button>
      </div>
      <p class="title-credit">NAN 2026 · TEAM RIVER</p>
    </section>

    <!-- 컷씬 화면 (배경 + 대화 오버레이만) -->
    <section id="screen-scene" class="screen"></section>

    <!-- 배 그리기 화면 -->
    <section id="screen-ship" class="screen">
      <div class="draw-area ship-draw">
        <div class="draw-header">
          <span id="ship-prompt">🚢 너의 배를 그려라!</span>
        </div>
        <canvas id="ship-canvas"></canvas>
        <div id="ship-log" class="battle-log">돛과 선체, 키를 갖추면 더 튼튼한 배가 된다.</div>
        <div class="draw-tools">
          <button id="btn-guide" class="btn-tool">📐 도안</button>
          <button id="btn-ship-clear" class="btn-tool">지우기</button>
          <button id="btn-ship-submit" class="btn-primary">출항!</button>
        </div>
      </div>
    </section>

    <!-- 항해 화면 -->
    <section id="screen-sail" class="screen screen-canvas">
      <canvas id="sail-canvas" class="pixel"></canvas>
      <div id="sail-objective" class="float-chip top"></div>
      <button id="sail-prompt" class="prompt-chip" hidden></button>
      <div class="key-hint">방향키/WASD 항해 · Space 상륙</div>
    </section>

    <!-- 섬 탐험 화면 -->
    <section id="screen-island" class="screen screen-canvas">
      <canvas id="island-canvas" class="pixel"></canvas>
      <div id="island-name" class="float-chip top"></div>
      <button id="island-prompt" class="prompt-chip" hidden></button>
      <div class="key-hint">←→/AD 이동 · Space 말 걸기</div>
    </section>

    <!-- 전투 화면 -->
    <section id="screen-battle" class="screen">
      <div class="battle-stage">
        <div class="boss-area">
          <div class="boss-hp-wrap">
            <span id="boss-name" class="boss-name">???</span>
            <div class="hp-bar"><div id="boss-hp" class="hp-fill"></div></div>
          </div>
          <div id="boss-sprite" class="boss-sprite"></div>
          <div id="damage-float" class="damage-float"></div>
        </div>
        <div class="ship-row">
          <img id="battle-ship" class="battle-ship" alt="나의 배" />
          <div class="ship-hp-wrap">
            <span class="boss-name">나의 배</span>
            <div class="hp-bar ship"><div id="ship-hp" class="hp-fill ship"></div></div>
          </div>
        </div>
        <div id="battle-log" class="battle-log"></div>
      </div>

      <div class="draw-area">
        <div class="draw-header">
          <span id="draw-prompt">✏️ 그려라!</span>
          <span id="draw-timer" class="draw-timer">20</span>
        </div>
        <canvas id="draw-canvas"></canvas>
        <div class="draw-tools">
          <button id="btn-clear" class="btn-tool">지우기</button>
          <button id="btn-submit" class="btn-primary">이걸로 공격!</button>
        </div>
      </div>
    </section>

    <!-- 승리(조각 획득) 화면 -->
    <section id="screen-victory" class="screen">
      <h1 id="victory-title">🏆 승리!</h1>
      <p id="victory-desc" class="game-desc"></p>
      <div id="victory-piece" class="blueprint-piece"></div>
      <p id="victory-sub" class="game-desc small"></p>
      <button id="btn-victory-next" class="btn-primary">⛵ 항해를 계속한다</button>
    </section>
  </div>

  <!-- 대화 오버레이 — 어느 화면 위에서든 뜬다 (스타듀밸리식 하단 대화창) -->
  <div id="dialogue-layer" hidden>
    <div id="dlg-visual" class="dlg-visual"></div>
    <div class="dlg-box">
      <div id="dlg-portrait" class="dlg-portrait" hidden></div>
      <div class="dlg-body">
        <div id="dlg-name" class="dlg-name">???</div>
        <div id="dlg-text" class="dlg-text"></div>
        <div class="dlg-hint">▼ Space / 클릭</div>
      </div>
    </div>
  </div>

  <!-- 모달(설정/지도/가방) -->
  <div id="modal-root" hidden>
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-head">
        <span id="modal-title">설정</span>
        <button id="modal-close" class="btn-tool small">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
