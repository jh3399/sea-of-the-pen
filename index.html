<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조선소 (Shipwright) — D1 코어 필</title>
</head>
<body data-mode="design">
  <canvas id="stage"></canvas>

  <header class="topbar">
    <h1>조선소 <span class="tag">D1 코어 필</span></h1>
    <div class="tools">
      <select id="corpus" title="재현 가능한 테스트 형상"></select>
      <button id="btn-load" class="btn">코퍼스 불러오기</button>
      <button id="btn-reset" class="btn">다시 그리기</button>
      <select id="item-type" title="부착할 아이템 (§4.2)"></select>
      <select id="item-angle" title="부착 방향 (§4.1)"></select>
      <button id="btn-attach" class="btn">부착 모드</button>
      <button id="btn-detach" class="btn ghost">전부 떼기</button>
      <select id="material" title="선체 재질 (§3)"></select>
      <select id="zone" title="환경 필드 (§6.1) — 맵은 필드 정의일 뿐이다"></select>
      <button id="btn-sail" class="btn primary" disabled>출항 ▶</button>
      <button id="btn-compare" class="btn primary">세 척 비교 (C)</button>
      <button id="btn-stress" class="btn">연속 차감 20회</button>
      <button id="btn-clear-worst" class="btn ghost">최대치 리셋</button>
    </div>
  </header>

  <div id="status" class="status">선체를 그리세요.</div>

  <aside class="panel">
    <div class="panel-title">선체 파라미터 (§2.1)</div>
    <div id="params"></div>
  </aside>

  <div id="metrics" class="metrics"></div>

  <footer class="hint">
    <span><b>설계</b> 드래그로 폐곡선 그리기</span>
    <span><b>노</b> ↑ 양쪽 / ↓ 역젓기 — 누를 때마다 한 번 젓는다</span>
    <span><b>선회</b> ← → 한쪽 노만 (회수 중에는 다시 못 젓는다)</span>
    <span><b>닻</b> Space · <b>부스터</b> A S D F · <b>키</b> Q E</span>
    <span><b>T</b> 예측 궤적선 · <b>C</b> 세 척 비교</span>
    <span><b>파손</b> 선체 클릭 · <b>F3</b> 계측 HUD</span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
