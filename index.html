<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>조선소 (Shipwright) — D0 기술 스파이크</title>
</head>
<body data-mode="design">
  <canvas id="stage"></canvas>

  <header class="topbar">
    <h1>조선소 <span class="tag">D0 기술 스파이크</span></h1>
    <div class="tools">
      <select id="corpus" title="재현 가능한 테스트 형상"></select>
      <button id="btn-load" class="btn">코퍼스 불러오기</button>
      <button id="btn-reset" class="btn">다시 그리기</button>
      <button id="btn-sail" class="btn primary" disabled>출항 ▶</button>
      <button id="btn-stress" class="btn">연속 차감 20회</button>
      <button id="btn-clear-worst" class="btn ghost">최대치 리셋</button>
    </div>
  </header>

  <div id="status" class="status">선체를 그리세요.</div>

  <aside class="panel">
    <div class="panel-title">선체 파라미터 (§2.1)</div>
    <div id="params"></div>
  </aside>

  <div id="metrics" class="metrics"></div>

  <footer class="hint">
    <span><b>설계</b> 드래그로 폐곡선 그리기</span>
    <span><b>항해</b> ↑↓ 추력 · ←→ 선미 횡추력(요잉 창발)</span>
    <span><b>파손</b> 선체 클릭 = 그 지점 차감</span>
    <span><b>F3</b> 계측 HUD</span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
