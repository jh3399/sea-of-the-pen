<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <title>그리는 자의 바다 — Sea of the Pen</title>
</head>
<body>
  <!-- 애니메이션 픽셀 배경 (메뉴·컷신 공용). 씬 전환은 scene/pixelbg.js -->
  <canvas id="bg" class="pixel" aria-hidden="true"></canvas>

  <!-- 그림 배경. 절차적 캔버스는 논리 356×200 이라 AI 도트 원본의 결이 통째로 뭉갠다 —
       타이틀에서 이미 겪은 문제라 같은 길을 낸다: 그림이 있는 씬은 이 레이어가 원본
       해상도로 깔고, 없는 씬은 투명해져서 아래 캔버스가 그대로 보인다.
       src 와 페이드는 scene/pixelbg.js 의 setScene() 이 관리한다. -->
  <img id="bg-photo" class="pixel" alt="" aria-hidden="true" />

  <div id="app">
    <section id="screen-title" class="screen active">
      <div class="title-wrap">
        <!-- 영문은 로고 그림 안에 있다. 밖에 또 쓰면 같은 말이 두 번 나온다.
             alt 에 한글까지 넣는 이유는 그림이 안 뜰 때 제목이 통째로 사라지기 때문. -->
        <h1 class="game-title">
          <img class="game-logo" src="assets/logo/title.png" width="134" height="88"
               alt="Sea of the Pen — 그리는 자의 바다" />
        </h1>
        <p class="game-title-ko">그리는 자의 바다</p>
      </div>

      <div class="title-menu">
        <button id="btn-start" class="btn-primary btn-start" type="button">▶ 시작하기</button>
        <button id="btn-replay" class="btn-tool" type="button" hidden>▷ 이야기 다시 보기</button>
        <button id="btn-sound" class="btn-tool" type="button">♪ 소리 켜짐</button>
      </div>
    </section>
  </div>

  <!-- 대화 오버레이 — 어느 화면 위에서든 뜬다 (스타듀밸리식 하단 대화창).
       id 다섯은 story/dialogue.js 가 그대로 찾는다. 바꾸면 거기도 같이 바꿀 것. -->
  <div id="dialogue-layer" hidden>
    <div id="dlg-visual" class="dlg-visual"></div>
    <div class="dlg-box">
      <div id="dlg-portrait" class="dlg-portrait" hidden></div>
      <div class="dlg-body">
        <div id="dlg-name" class="dlg-name">???</div>
        <div id="dlg-text" class="dlg-text"></div>
        <div class="dlg-hint">▼ Space / 클릭</div>
      </div>
    </div>
  </div>

  <!-- 대화창 바깥에 둔다 — 안에 두면 이 클릭이 대사 진행까지 같이 먹는다 -->
  <button id="btn-skip" class="skip-btn" type="button" hidden>건너뛰기 (Esc)</button>

  <script type="module" src="/src/menu/screen.js"></script>
</body>
</html>
