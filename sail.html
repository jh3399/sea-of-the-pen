<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <title>그리는 자의 바다 — 항해</title>
</head>
<body>
  <div class="sail-stage">
    <canvas id="sea"></canvas>

    <div class="hud">
      <div class="hud-clock">
        <span class="hud-clock-icon" aria-hidden="true">⏱</span>
        <span class="hud-label">시간</span>
        <span class="hud-clock-value" id="hud-clock">00:00</span>
      </div>

      <div class="hud-distance">
        <span class="hud-label">목표까지 거리</span>
        <div class="hud-bar-track">
          <div class="hud-bar-fill" id="hud-bar-fill"></div>
          <span class="hud-bar-flag" aria-hidden="true">🏁</span>
        </div>
        <span class="hud-distance-value" id="hud-distance">-- m</span>
      </div>
    </div>

    <!-- 조작 안내 — 연습 해역에서만 뜬다 (game/progress.js 의 STAGES[].hints).
         읽는 목록이 아니라 **해 보면 켜지는 판**이다. 직접 해 본 줄만 불이 들어오고,
         셋을 다 해 보면 판이 저절로 사라진다. 「키」 줄은 배에 키가 달렸을 때만 나온다. -->
    <div class="sail-hints" id="sail-hints" hidden aria-live="polite">
      <p class="sail-hints-title">조작</p>
      <ul class="sail-hints-list" id="sail-hints-list"></ul>
    </div>

    <!-- 장비·지도 (Tab) — 지도는 game/progress.js 의 ROUTE 를 sail/voyagemap.js 가 그린다. -->
    <div class="sail-panel hidden" id="gear-overlay" role="dialog" aria-modal="true" aria-labelledby="gear-title">
      <div class="sail-panel-box">
        <h2 id="gear-title">항해 일지</h2>
        <p class="sail-panel-sub">지도</p>
        <canvas id="voyage-map" class="voyage-map" width="320" height="150"></canvas>
        <p class="sail-panel-sub">배에 실은 것</p>
        <ul class="gear-list" id="gear-list"></ul>
        <div class="sail-panel-actions">
          <button class="clear-btn clear-btn-primary" id="btn-gear-close" type="button">닫기 (Tab)</button>
        </div>
      </div>
    </div>

    <!-- 설정 (Esc) — 소리와 나가기. 항해 중에 게임을 끝낼 방법이 여기 말고는 없다. -->
    <div class="sail-panel hidden" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sail-panel-box sail-panel-box-narrow">
        <h2 id="settings-title">설정</h2>
        <div class="sail-panel-actions sail-panel-actions-stack">
          <button class="clear-btn" id="btn-sound" type="button" aria-pressed="false">♪ 소리 켜짐</button>
          <button class="clear-btn clear-btn-primary" id="btn-settings-close" type="button">돌아가기 (Esc)</button>
          <button class="clear-btn clear-btn-ghost" id="btn-quit" type="button">메인 메뉴로 나가기</button>
        </div>
        <p class="sail-panel-note">나가면 지금 항해는 사라집니다.</p>
      </div>
    </div>

    <div class="clear-overlay hidden" id="clear-overlay" role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <div class="clear-panel">
        <p class="clear-kicker">목표 도착</p>
        <h1 id="clear-title">항해 완료!</h1>

        <div class="clear-stars" id="clear-stars" aria-hidden="true">
          <span>★</span><span>★</span><span>★</span>
        </div>
        <p class="clear-rating" id="clear-rating">별 --개</p>

        <div class="clear-record">
          <span>클리어 시간</span>
          <strong id="clear-time">00:00.00</strong>
        </div>

        <div class="clear-actions">
          <button class="clear-btn clear-btn-primary" id="btn-retry" type="button">다시하기</button>
          <button class="clear-btn" id="btn-next" type="button" aria-describedby="next-stage-note" disabled>다음 스테이지</button>
          <button class="clear-btn clear-btn-ghost" id="btn-clear-menu" type="button">메인 메뉴</button>
        </div>
        <p class="clear-note" id="next-stage-note">다음 스테이지 준비 중</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/sail/screen.js"></script>
</body>
</html>
