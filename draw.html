<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/logo/favicon.png" />
  <title>그리는 자의 바다 — 배 그리기</title>
</head>
<body>
  <div class="book">
    <div class="book-frame">
      <div class="spiral" aria-hidden="true"></div>
      <div class="page" id="page">
        <canvas id="ink"></canvas>

        <div class="blueprint">
          <button id="blueprint-toggle" class="blueprint-toggle" type="button">
            <span class="caret">▼</span> 도면 보기
          </button>
          <div id="blueprint-panel" class="blueprint-panel hidden"></div>
        </div>

        <button id="btn-clear" class="clear-btn" type="button" title="다시 그리기">↺ 다시 그리기</button>
        <div id="status" class="page-status">선체를 그려 주인공을 감싸세요.</div>
      </div>
    </div>

    <aside class="side">
      <div class="side-top-controls">
        <button id="btn-menu" class="menu-btn" type="button">← 메뉴</button>
        <button id="btn-tutorial" class="tutorial-replay-btn" type="button">? 튜토리얼</button>
      </div>
      <div class="panel-card">
        <div class="panel-card-title">기본 장치</div>
        <div id="device-list" class="item-list"></div>
      </div>
      <!-- 아이템 칸은 열린 아이템이 하나도 없으면 통째로 숨는다 (첫 배는 노만 단다).
           빈 칸을 남겨 두면 "여기 뭔가 있어야 하는데 안 뜬다"로 읽힌다. -->
      <div class="panel-card" id="item-card">
        <div class="panel-card-title">아이템</div>
        <div id="item-list" class="item-list"></div>
        <div id="direction-picker" class="direction-picker hidden" aria-label="장착 방향">
          <span class="direction-label">장착 방향</span>
          <div id="direction-list" class="direction-list"></div>
        </div>
      </div>
      <div class="panel-card">
        <div class="panel-card-title">재질</div>
        <div id="material-list" class="material-list"></div>
      </div>
      <button id="btn-finish" class="finish-btn" type="button" disabled>완성하기</button>
    </aside>
  </div>

  <div id="draw-tutorial" class="draw-tutorial" hidden>
    <div class="tutorial-mask" data-tutorial-mask aria-hidden="true"></div>
    <div class="tutorial-mask" data-tutorial-mask aria-hidden="true"></div>
    <div class="tutorial-mask" data-tutorial-mask aria-hidden="true"></div>
    <div class="tutorial-mask" data-tutorial-mask aria-hidden="true"></div>
    <div id="tutorial-ring" class="tutorial-ring" aria-hidden="true"></div>
    <div id="tutorial-shield" class="tutorial-shield" aria-hidden="true"></div>
    <section id="tutorial-card" class="tutorial-card" role="dialog" aria-modal="false"
      aria-labelledby="tutorial-title" aria-describedby="tutorial-body">
      <div id="tutorial-step" class="tutorial-step" aria-live="polite"></div>
      <h2 id="tutorial-title"></h2>
      <p id="tutorial-body"></p>
      <p id="tutorial-hint" class="tutorial-hint"></p>
      <div class="tutorial-actions">
        <button id="tutorial-skip" class="tutorial-skip" type="button">건너뛰기 <span>(Esc)</span></button>
        <button id="tutorial-next" class="tutorial-next" type="button">다음</button>
      </div>
    </section>
  </div>

  <script type="module" src="/src/draw/screen.js"></script>
</body>
</html>
